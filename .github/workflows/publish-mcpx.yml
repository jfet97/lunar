name: Publish MCPX image

on:
  push:
    branches: [main]
    paths:
      - "mcpx/**"
      - "ai-gateway-shared/public/**"
      - ".github/workflows/publish-mcpx.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mcpx-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository_owner == 'jfet97-home'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            mcpx/package-lock.json
            ai-gateway-shared/public/package-lock.json
      - name: Install shared dependencies
        working-directory: ai-gateway-shared/public
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build shared core
        working-directory: ai-gateway-shared/public
        run: node_modules/.bin/tsc --build packages/core/tsconfig.json
      - name: Install locked dependencies
        working-directory: mcpx
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check fork regressions
        working-directory: mcpx/packages/mcpx-server
        run: >-
          ../../node_modules/.bin/jest --config jest.config.cjs --runInBand --runTestsByPath
          src/services/paginated-client.test.ts
          src/services/local-tool-search.test.ts
          src/services/hub-downstream-session-client.test.ts
          src/server/lazy-tools.test.ts
          src/server/lazy-gateway.test.ts
          src/server/json-body.test.ts
          src/services/management-tools.test.ts
          src/services/internal-capabilities-service.test.ts
          src/services/control-plane-service.test.ts
          src/server/server-logout.test.ts
          src/server/tool-call-cache.test.ts
          src/services/upstream-logout.test.ts
          src/services/system-state.test.ts
          src/services/oauth-connection-handler.test.ts
          src/oauth-providers/factory.test.ts
          src/services/local-saved-setups.test.ts
          src/services/local-export-service.test.ts
          src/services/local-import-service.test.ts
          src/server/control-plane.test.ts
          src/services/setup-manager.test.ts
          src/services/client-extension.test.ts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcpx/Dockerfile
          target: mcpx
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcpx:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mcpx:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/${{ github.repository_owner }}/mcpx@${IMAGE_DIGEST}" >> "$GITHUB_STEP_SUMMARY"
